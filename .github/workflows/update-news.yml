name: 🤖 Auto-update News from GAS

on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごとに実行
  workflow_dispatch:      # 手動実行も可能

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔄 Download latest news.json from Google Drive
        run: |
          echo "📡 Fetching latest news from GAS..."
          mkdir -p frontend/data
          curl -L -o frontend/data/news.json "https://docs.google.com/uc?export=download&id=18QvI3MYbQ6ZjcsFb01y7rzhVqtcV3zAl"
          
          if [ -f frontend/data/news.json ]; then
            echo "✅ news.json downloaded successfully"
            echo "📊 File size: $(wc -c < frontend/data/news.json) bytes"
            echo "📝 Article count: $(grep -o '"title"' frontend/data/news.json | wc -l)"
          else
            echo "❌ Failed to download news.json"
            exit 1
          fi
      
      - name: 🔍 Check for changes
        id: check_changes
        run: |
          git diff --exit-code frontend/data/news.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: 💾 Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GADGET HUNTER Bot"
          git config user.email "actions@github.com"
          git add frontend/data/news.json
          
          ARTICLE_COUNT=$(grep -o '"title"' frontend/data/news.json | wc -l)
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M JST')
          
          git commit -m "🤖 Auto-update: $ARTICLE_COUNT articles from GAS [$CURRENT_DATE]"
          git push
          
          echo "✅ Successfully pushed updates to GitHub!"
      
      - name: 🎉 No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "ℹ️ No new articles found. news.json is up to date."
      
      - name: 🚨 Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 GADGET HUNTER - Auto-update Failed';
            const body = `## ❌ ニュース自動更新が失敗しました
            
            **失敗日時:** ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })}
            **ワークフロー:** ${context.workflow}
            **実行ID:** ${context.runId}
            
            ### 📋 詳細
            - **リポジトリ:** ${context.repo.owner}/${context.repo.repo}
            - **ブランチ:** ${context.ref}
            - **コミット:** ${context.sha.substring(0, 7)}
            
            ### 🔍 確認すべき点
            1. Google DriveのファイルID (18QvI3MYbQ6ZjcsFb01y7rzhVqtcV3zAl) が正しいか
            2. ファイルの共有設定が「リンクを知っている全員」になっているか
            3. GASが正常に動作しているか
            
            [ワークフロー実行ログを確認](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automation']
            });