name: 🤖 Auto-update News from GAS

on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごとに実行
  workflow_dispatch:      # 手動実行も可能

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔄 Download latest news.json from GAS Web App
        run: |
          echo "📡 Fetching latest news from GAS Web App..."
          mkdir -p frontend/data
          
          curl -L \
            -H "User-Agent: Mozilla/5.0" \
            -o frontend/data/news.json \
            "${{ secrets.GAS_WEB_APP_URL }}?action=news"
          
          if [ -f frontend/data/news.json ]; then
            # HTMLが返ってきていないかチェック（GASエラー検知）
            FIRST_CHAR=$(head -c 1 frontend/data/news.json)
            if [ "$FIRST_CHAR" != "[" ] && [ "$FIRST_CHAR" != "{" ]; then
              echo "❌ Response is not JSON (got HTML or error page)"
              echo "--- First 200 bytes ---"
              head -c 200 frontend/data/news.json
              exit 1
            fi
            echo "✅ news.json downloaded successfully"
            echo "📊 File size: $(wc -c < frontend/data/news.json) bytes"
            echo "📝 Article count: $(grep -o '"title"' frontend/data/news.json | wc -l)"
          else
            echo "❌ Failed to download news.json"
            exit 1
          fi
      
      - name: 🛡️ Validate JSON integrity
        run: |
          if jq empty frontend/data/news.json > /dev/null 2>&1; then
            echo "✅ JSON is valid."
          else
            echo "❌ Invalid JSON detected! (Google Drive limitation or corrupt file)"
            echo "--- First 50 lines (debug) ---"
            head -50 frontend/data/news.json
            exit 1
          fi
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Install dependencies & build article pages
        run: |
          npm install
          npm run build
          echo "✅ Article pages generated successfully"
          echo "📊 Article pages count: $(find frontend/articles -name 'index.html' | wc -l)"
      
      - name: 🔍 Check for changes
        id: check_changes
        run: |
          git diff --exit-code frontend/data/news.json frontend/articles/ || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: 💾 Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GADGET HUNTER Bot"
          git config user.email "actions@github.com"
          git add frontend/data/news.json frontend/articles/
          
          ARTICLE_COUNT=$(grep -o '"title"' frontend/data/news.json | wc -l)
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M JST')
          
          git commit -m "🤖 Auto-update: $ARTICLE_COUNT articles from GAS [$CURRENT_DATE]"
          git pull --rebase origin main
          git push
          
          echo "✅ Successfully pushed updates to GitHub!"
      
      - name: 🎉 No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "ℹ️ No new articles found. news.json is up to date."
      
      - name: 🚨 Create Issue on Failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 GADGET HUNTER - Auto-update Failed';
            const body = `## ❌ ニュース自動更新が失敗しました
            
            **失敗日時:** ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })}
            **ワークフロー:** ${context.workflow}
            **実行ID:** ${context.runId}
            
            ### 📋 詳細
            - **リポジトリ:** ${context.repo.owner}/${context.repo.repo}
            - **ブランチ:** ${context.ref}
            - **コミット:** ${context.sha.substring(0, 7)}
            
            ### 🔍 確認すべき点
            1. GitHub SecretsのGAS_WEB_APP_URLが正しく設定されているか
            2. GAS Web AppのアクセスがAnyone（全員）になっているか
            3. GASが正常に動作しているか（スクリプトエディタのログを確認）
            
            [ワークフロー実行ログを確認](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automation']
            });